# yaml-language-server: $schema=https://raw.githubusercontent.com/IT25A/deploy-workflows/main/schema/it25a.schema.json
# One application, one container (for example SvelteKit with adapter-node)
version: 1
services:
  app:
    build: .
    port: 3000
    route: { host: "@" }            # https://<alias>.apps.it25a.de
    environment:
      MESSAGE_SUFFIX: "this is an ordinary message!"