services:
  web:
    image: ${IMAGE_TAG} # Wird von der Pipeline automatisch gesetzt
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
    labels:
      caddy: "http://${FQDN}"
      caddy.reverse_proxy: "web:${PORT:-3000}"
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true