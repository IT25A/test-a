services:
  web:
    image: ${IMAGE_TAG_FRONTEND} # Wird von der Pipeline automatisch gesetzt
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://${FQDN}/api
    labels:
      caddy: "http://${FQDN}"
      # 1. Definiere einen Matcher für alle Pfade, die mit /api/* beginnen
      caddy.@api: "path /api/*"
      # 2. Leite gematchte /api/* Anfragen an das Backend weiter (Port 3001)
      caddy.reverse_proxy: "@api {{upstreams ${PORT_BACKEND:-3001}}}"
      # 3. Fallback: Alle anderen Anfragen gehen ans Frontend (Port 3000)
      caddy.reverse_proxy.1: "{{upstreams ${PORT_FRONTEND:-3000}}}"
    networks:
      - default
      - caddy_net

  api:
    image: ${IMAGE_TAG_BACKEND} # Wird von der Pipeline automatisch gesetzt
    restart: unless-stopped
    # Das Backend benötigt keine eigene öffentliche caddy:-Subdomain mehr, 
    # da es komplett über den /api-Pfad des Web-Containers abgesichert ist!
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true