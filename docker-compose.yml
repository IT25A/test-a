services:
  web:
    image: ${IMAGE_TAG} # Wird von der Pipeline automatisch gesetzt
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
    labels:
      caddy: "http://"
      caddy.caddyfile: "http://${FQDN} {\n  reverse_proxy web:${PORT:-3000}\n}"
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true