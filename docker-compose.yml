services:
  web:
    image: ${IMAGE_TAG_FRONTEND} # Wird von der Pipeline automatisch gesetzt
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://${FQDN}/api
    labels:
      caddy: "${FQDN}"
      # 1. Handle für alle /api/* Anfragen -> direkt an den api-Container
      caddy.handle.0: "/api/*"
      caddy.handle.0_reverse_proxy: "api:3001"
      # 2. Fallback-Handle für alle anderen Anfragen -> ans Frontend
      caddy.handle.1: "*"
      caddy.handle.1_reverse_proxy: "web:3000"
    networks:
      - default
      - caddy_net

  api:
    image: ${IMAGE_TAG_BACKEND} # Wird von der Pipeline automatisch gesetzt
    restart: unless-stopped
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true