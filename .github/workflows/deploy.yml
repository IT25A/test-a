name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, closed ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write      # ERFORDERLICH für den signierten GitHub JWT-Token!
  pull-requests: write # ERFORDERLICH für PR-Kommentare
  issues: write        # ERFORDERLICH für PR-Kommentare

jobs:
  # JOB 1: Wird NUR ausgeführt, wenn ein PR geschlossen/gemergt wird
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger Cleanup
        run: |
          PAYLOAD=$(jq -n --arg pr "${{ github.event.number }}" '{pr_number: $pr}')
          
          HTTP_STATUS=$(curl -s -o cleanup_response.json -w "%{http_code}" -X POST https://cd.it25a.de/cleanup \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat cleanup_response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Fehler beim Bereinigen der PR-Umgebung!"
            exit 1
          fi

  # JOB 2: Build & Deploy für Main-Pushes sowie neu geöffnete/aktualisierte PRs
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Set Tag Name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.number }}"
          else
            TAG="main"
          fi
          
          RAW_TAG="${{ env.REGISTRY }}/${{ github.repository }}:$TAG"
          echo "IMAGE_TAG=${RAW_TAG,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.IMAGE_TAG }}

      - name: Trigger Home Lab Deploy
        id: deploy
        run: |
          PR_NUM=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.number }}"
          fi

          # 1. Variables & Secrets sammeln
          VARS_JSON=$(echo '${{ toJson(vars) }}')
          SECRETS_JSON=$(jq -n \
            --arg api_key "${{ secrets.API_KEY }}" \
            '{API_KEY: $api_key}')

          ENV_JSON=$(jq -s '.[0] * .[1]' <(echo "$VARS_JSON") <(echo "$SECRETS_JSON"))

          # 2. Payload bauen
          PAYLOAD=$(jq -n \
            --rawfile compose docker-compose.yml \
            --arg tag "${{ steps.meta.outputs.IMAGE_TAG }}" \
            --arg pr "$PR_NUM" \
            --argjson env "$ENV_JSON" \
            '{image_tag: $tag, compose_yaml:$compose, pr_number: $pr, env_vars:$env}')

          # 3. Deploy-Request absenden: JSON-Response in Datei schreiben & Statuscode erfassen
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST https://cd.it25a.de/deploy \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Deployment fehlgeschlagen!"
            exit 1
          fi

          # 4. URL sauber aus der gespeicherten JSON-Datei auslesen
          URL=$(jq -r '.url' response.json)
          echo "DEPLOY_URL=$URL" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview Link
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.DEPLOY_URL }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Environment deployed!**\n\n🔍 Live Preview: [${url}](${url})`
            });