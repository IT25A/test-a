name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, closed ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger Cleanup
        run: |
          PAYLOAD=$(jq -n --arg pr "${{ github.event.number }}" '{pr_number: $pr}')
          
          HTTP_STATUS=$(curl -s -o cleanup_response.json -w "%{http_code}" -X POST https://cd.it25a.de/cleanup \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Fehler beim Bereinigen!"
            exit 1
          fi

      - name: Set GitHub Deployment to Inactive
        uses: actions/github-script@v7
        with:
          script: |
            const prRef = context.payload.pull_request.head.ref;
            const prSha = context.payload.pull_request.head.sha;
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'preview',
                per_page: 100,
              });

              const prDeployments = deployments.filter(d => d.ref === prRef || d.sha === prSha);
              for (const deployment of prDeployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'PR closed and preview destroyed',
                });
              }
            } catch (e) {
              console.log(`Hinweis: ${e.message}`);
            }

  build-images:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: app
            context: .
            dockerfile: ./Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag Name
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SERVICE_NAME="${{ matrix.service.name }}"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_TAG="pr-${{ github.event.number }}"
          else
            REF_TAG="main"
          fi
          
          if [ "$SERVICE_NAME" = "app" ]; then
            FULL_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${REF_TAG}"
          else
            FULL_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${SERVICE_NAME}-${REF_TAG}"
          fi
          
          echo "IMAGE_TAG=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "Built Tag: $FULL_TAG"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.IMAGE_TAG }}

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.DEPLOY_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Parse Compose & Trigger Server Deploy
        id: deploy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            
            const prNum = context.payload.pull_request ? context.payload.pull_request.number.toString() : "";
            const refTag = prNum ? `pr-${prNum}` : "main";
            const repoLower = context.payload.repository.full_name.toLowerCase();
            
            // docker-compose.yml einlesen und sauber nach ghcr.io-Images durchsuchen
            const composeContent = fs.readFileSync('docker-compose.yml', 'utf8');
            const imageRegex = /image:\s*([^\s"]+)/g;
            let match;
            let tagsArray = [];
            
            while ((match = imageRegex.exec(composeContent)) !== null) {
              let img = match[1].replace(/['"]/g, '').trim();
              if (img.includes('ghcr.io')) {
                // Ersetze Variablen wie ${IMAGE_TAG:-...} oder expandiere sie
                img = img.replace(/\$\{[^}]+\:-([^}]+)\}/g, '$1');
                if (img.startsWith('ghcr.io')) {
                  tagsArray.push(img);
                }
              }
            }
            
            // Fallback, falls keine Images gefunden wurden
            if (tagsArray.length === 0) {
              tagsArray.push(`ghcr.io/${repoLower}:${refTag}`);
            }
            
            // Env-Variablen & Secrets zusammenführen
            const vars = process.env;
            // Wir lesen die GitHub vars und secrets aus dem Kontext
            const envVars = { ...context.payload.client_payload }; 
            // Hinweis: secrets.API_KEY übergeben wir sicher über env
            const customEnv = {
              API_KEY: process.env.SECRET_API_KEY || ""
            };
            
            const payload = {
              image_tags: [...new Set(tagsArray)],
              compose_yaml: composeContent,
              pr_number: prNum ? prNum : null,
              env_vars: customEnv
            };
            
            console.log("Sending Payload:", JSON.stringify(payload, null, 2));
            
            const token = process.env.OIDC_TOKEN;
            
            // HTTP Request an den Deployer
            const res = await fetch('https://cd.it25a.de/deploy', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify(payload)
            });
            
            const responseBody = await res.json();
            console.log("Response Status:", res.status);
            console.log("Response Body:", responseBody);
            
            if (res.status !== 200) {
              core.setFailed(`Deployment fehlgeschlagen: ${JSON.stringify(responseBody)}`);
              return;
            }
            
            core.setOutput('DEPLOY_URL', responseBody.url);
          env:
            OIDC_TOKEN: ${{ steps.oidc.outputs.TOKEN }}
            SECRET_API_KEY: ${{ secrets.API_KEY }}

      - name: Inactivate Older Production Deployments
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'production',
                per_page: 100,
              });

              deployments.sort((a, b) => b.id - a.id);
              const olderDeployments = deployments.slice(1);

              for (const deployment of olderDeployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Superseded by newer production deployment',
                });
              }
            } catch (e) {
              console.log(`Hinweis: ${e.message}`);
            }