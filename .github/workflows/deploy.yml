name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, closed ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger Cleanup
        run: |
          PAYLOAD=$(jq -n --arg pr "${{ github.event.number }}" '{pr_number: $pr}')
          
          HTTP_STATUS=$(curl -s -o cleanup_response.json -w "%{http_code}" -X POST https://cd.it25a.de/cleanup \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Fehler beim Bereinigen!"
            exit 1
          fi

      - name: Set GitHub Deployment to Inactive
        uses: actions/github-script@v7
        with:
          script: |
            const prRef = context.payload.pull_request.head.ref;
            const prSha = context.payload.pull_request.head.sha;
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'preview',
                per_page: 100,
              });

              const prDeployments = deployments.filter(d => d.ref === prRef || d.sha === prSha);
              for (const deployment of prDeployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'PR closed and preview destroyed',
                });
              }
            } catch (e) {
              console.log(`Hinweis: ${e.message}`);
            }

  build-images:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: app
            context: .
            dockerfile: ./Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag Name
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SERVICE_NAME="${{ matrix.service.name }}"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_TAG="pr-${{ github.event.number }}"
          else
            REF_TAG="main"
          fi
          
          if [ "$SERVICE_NAME" = "app" ]; then
            FULL_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${REF_TAG}"
          else
            FULL_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${SERVICE_NAME}-${REF_TAG}"
          fi
          
          echo "IMAGE_TAG=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "Built Tag: $FULL_TAG"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.IMAGE_TAG }}

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.DEPLOY_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger Server Deploy
        id: deploy
        run: |
          PR_NUM=""
          REF_TAG="main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.number }}"
            REF_TAG="pr-${PR_NUM}"
          fi

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          TAGS_ARRAY=()
          while IFS= read -r img; do
            if [ -n "$img" ]; then
              TAGS_ARRAY+=("$img")
            fi
          done < <(grep -oE "ghcr\.io/${REPO_LOWER}[a-zA-Z0-9_.-/:]+" docker-compose.yml || true)

          if [ ${#TAGS_ARRAY[@]} -eq 0 ]; then
            TAGS_ARRAY+=("${{ env.REGISTRY }}/${REPO_LOWER}:${REF_TAG}")
          fi

          TAGS_JSON=$(printf '\%s\n' "${TAGS_ARRAY[@]}" | jq -R . | jq -s .)

          VARS_JSON=$(echo '${{ toJson(vars) }}')
          SECRETS_JSON=$(jq -n --arg api_key "${{ secrets.API_KEY }}" '{API_KEY: $api_key}')
          ENV_JSON=$(jq -s '.[0] * .[1]' <(echo "$VARS_JSON") <(echo "$SECRETS_JSON"))

          PAYLOAD=$(jq -n \
            --rawfile compose docker-compose.yml \
            --argjson tags "$TAGS_JSON" \
            --arg pr "$PR_NUM" \
            --argjson env "$ENV_JSON" \
            '{image_tags: $tags, compose_yaml:$compose, pr_number: $pr, env_vars:$env}')

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST https://cd.it25a.de/deploy \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Deployment fehlgeschlagen!"
            cat response.json
            exit 1
          fi

          URL=$(jq -r '.url' response.json)
          echo "DEPLOY_URL=$URL" >> $GITHUB_OUTPUT

      - name: Inactivate Older Production Deployments
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'production',
                per_page: 100,
              });

              deployments.sort((a, b) => b.id - a.id);
              const olderDeployments = deployments.slice(1);

              for (const deployment of olderDeployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Superseded by newer production deployment',
                });
              }
            } catch (e) {
              console.log(`Hinweis: ${e.message}`);
            }