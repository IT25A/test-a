name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, closed ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger Cleanup
        run: |
          PAYLOAD=$(jq -n --arg pr "${{ github.event.number }}" '{pr_number: $pr}')
          HTTP_STATUS=$(curl -s -o cleanup_response.json -w "%{http_code}" -X POST https://cd.it25a.de/cleanup \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ne 200 ]; then exit 1; fi

      - name: Set GitHub Deployment to Inactive
        uses: actions/github-script@v7
        with:
          script: |
            const prRef = context.payload.pull_request.head.ref;
            const prSha = context.payload.pull_request.head.sha;
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner, repo: context.repo.repo, environment: 'preview', per_page: 100,
              });
              for (const d of deployments.filter(d => d.ref === prRef || d.sha === prSha)) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: d.id, state: 'inactive',
                });
              }
            } catch (e) {}

  build-images:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: frontend
            context: ./multi-image-test/frontend
            dockerfile: ./multi-image-test/frontend/Dockerfile
          - name: backend
            context: ./multi-image-test/backend
            dockerfile: ./multi-image-test/backend/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Resolve URLs from Deployer API
        id: resolve
        run: |
          PR_NUM=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.number }}"
          fi

          # Wir fragen stets beide Services ab, um an die korrekte API-URL zu kommen
          PAYLOAD=$(jq -n --argjson services '["frontend", "backend"]' --arg pr "$PR_NUM" '{services: $services, pr_number: ($pr | if . == "" then null else . end)}')

          RESPONSE=$(curl -s -X POST https://cd.it25a.de/resolve \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.TOKEN }}" \
            -d "$PAYLOAD")

          echo "Resolve Response: $RESPONSE"
          
          # Die API/Backend-URL für das Frontend extrahieren
          API_URL=$(echo "$RESPONSE" | jq -r '.urls.backend // .urls.api // ""')

          if [ -z "$API_URL" ] \vert{}\vert{} [ "$API_URL" = "null" ]; then
            echo "Fehler beim Auflösen der API-URL!"
            exit 1
          fi

          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT

      - name: Determine Build Args
        id: build-args
        run: |
          # Nur das Frontend bekommt die VITE_API_URL übergeben
          if [ "${{ matrix.service.name }}" = "frontend" ]; then
            echo "VITE_API_URL=${{ steps.resolve.outputs.API_URL }}" >> $GITHUB_OUTPUT
            echo "Passing VITE_API_URL: ${{ steps.resolve.outputs.API_URL }}"
          else
            echo "VITE_API_URL=" >> $GITHUB_OUTPUT
          fi

      - name: Set Image Tag Name
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SERVICE_NAME="${{ matrix.service.name }}"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_TAG="pr-${{ github.event.number }}"
          else
            REF_TAG="main"
          fi
          
          FULL_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${SERVICE_NAME}-${REF_TAG}"
          echo "IMAGE_TAG=$FULL_TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=${{ steps.build-args.outputs.VITE_API_URL }}

      - name: Save Image Tag to File
        run: echo "${{ steps.meta.outputs.IMAGE_TAG }}" > image-tag-${{ matrix.service.name }}.txt

      - name: Upload Image Tag Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-${{ matrix.service.name }}
          path: image-tag-${{ matrix.service.name }}.txt
          retention-days: 1

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.DEPLOY_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Image Tags
        uses: actions/download-artifact@v4
        with:
          path: downloaded-tags
          pattern: tag-*

      - name: Get GitHub JWT Token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=it25a-deployer" | jq -r '.value')
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger Server Deploy
        id: deploy
        uses: actions/github-script@v7
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.TOKEN }}
          SECRET_API_KEY: ${{ secrets.API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const prNum = context.payload.pull_request ? context.payload.pull_request.number.toString() : "";
            const repoLower = context.payload.repository.full_name.toLowerCase();
            
            let tagsArray = [];
            const tagsDir = 'downloaded-tags';
            
            function walkDir(dir) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory()) {
                  walkDir(filePath);
                } else if (file.endsWith('.txt')) {
                  const tag = fs.readFileSync(filePath, 'utf8').trim();
                  if (tag) tagsArray.push(tag);
                }
              }
            }
            
            if (fs.existsSync(tagsDir)) {
              walkDir(tagsDir);
            }
            
            if (tagsArray.length === 0) {
              const refTag = prNum ? `pr-${prNum}` : "main";
              tagsArray.push(`ghcr.io/${repoLower}:${refTag}`);
            }
            
            const composeContent = fs.readFileSync('docker-compose.yml', 'utf8');
            
            const customEnv = {
              API_KEY: process.env.SECRET_API_KEY || ""
            };
            
            const payload = {
              image_tags: [...new Set(tagsArray)],
              compose_yaml: composeContent,
              pr_number: prNum ? prNum : null,
              env_vars: customEnv
            };
            
            const token = process.env.OIDC_TOKEN;
            
            const res = await fetch('https://cd.it25a.de/deploy', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify(payload)
            });
            
            const responseBody = await res.json();
            if (res.status !== 200) {
              core.setFailed(`Deployment fehlgeschlagen: ${JSON.stringify(responseBody)}`);
              return;
            }
            
            core.setOutput('DEPLOY_URL', responseBody.url);

      - name: Inactivate Older Production Deployments
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner, repo: context.repo.repo, environment: 'production', per_page: 100,
              });
              for (const d of deployments.slice(1)) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: d.id, state: 'inactive',
                });
              }
            } catch (e) {}